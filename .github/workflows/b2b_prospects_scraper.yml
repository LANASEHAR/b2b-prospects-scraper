name: B2B Prospects Scraper

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Exécution automatique le lundi et le jeudi à 06h00 UTC
    - cron: '0 6 * * 1,4'

concurrency:
  group: b2b-scraper
  cancel-in-progress: false

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run Scraper (PagesJaunes, Overpass OSM & SIRENE)
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: |
          python scraper_prospects_france.py

      - name: Save CSV exports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2b-prospects-${{ github.run_id }}
          path: |
            laveries_france.csv
            salons_coiffure_france.csv
          if-no-files-found: ignore
          retention-days: 30
