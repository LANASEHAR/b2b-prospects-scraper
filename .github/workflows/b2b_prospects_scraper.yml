name: B2B Prospects Scraper (Journalier 1h30)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 5 * * *'

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verifier la presence des fichiers
        run: |
          echo "=== Liste des fichiers a la racine du repo ==="
          ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run Scraper
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: |
          if [ -f "scraper_prospects_france.py" ]; then
            python scraper_prospects_france.py
          elif [ -f "scraper.py" ]; then
            python scraper.py
          else
            echo "ERREUR : Aucun fichier Python de scraping trouve a la racine !"
            exit 1
          fi

      - name: Save CSV exports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2b-prospects-${{ github.run_id }}
          path: "*.csv"
          if-no-files-found: ignore
          retention-days: 30
